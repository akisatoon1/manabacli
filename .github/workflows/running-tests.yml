name: Running Tests

on:
  pull_request: 
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      - name: Setup go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.3'
      
      - run: go test ./...
